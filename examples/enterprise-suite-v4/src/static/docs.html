<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDD Enterprise Suite v4.0 — Documentação Técnica Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: #05070d;
            --surface: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --code-bg: #050811;
            --callout-bg: rgba(59, 130, 246, 0.08);
            --callout-border: rgba(59, 130, 246, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { height: 56px; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
        .brand-group { display: flex; align-items: center; gap: 0.8rem; }
        .brand-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 9999px; }
        
        .btn { padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn:hover { background: rgba(255, 255, 255, 0.08); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .layout-container { display: grid; grid-template-columns: 280px 1fr 240px; margin-top: 56px; min-height: calc(100vh - 56px); }

        aside.sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 1.2rem 0.8rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .search-trigger { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); padding: 0.55rem 0.8rem; border-radius: 8px; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; }
        .search-trigger kbd { background: rgba(255, 255, 255, 0.08); padding: 0.1rem 0.4rem; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
        .sidebar-nav { list-style: none; }
        .nav-cat { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.8rem 0.6rem 0.3rem 0.6rem; }
        .nav-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.7rem; border-radius: 8px; color: #cbd5e1; font-size: 0.86rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.15s; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }

        main.content { padding: 3.5rem 4rem; max-width: 860px; margin: 0 auto; width: 100%; }
        .breadcrumb { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .doc-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; }
        .doc-subtitle { font-size: 1.15rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        h2 { font-size: 1.5rem; font-weight: 800; margin-top: 2rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 0.98rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.2rem; }
        ul { padding-left: 1.4rem; margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.7; }
        li { margin-bottom: 0.4rem; }

        .callout { background: var(--callout-bg); border: 1px solid var(--callout-border); border-radius: 12px; padding: 1.2rem 1.4rem; margin: 1.5rem 0; display: flex; gap: 1rem; align-items: flex-start; }

        .modal-search { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 100; }
        .search-container { background: #080c18; border: 1px solid var(--border-hover); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); overflow: hidden; }
        .search-input-header { display: flex; align-items: center; gap: 0.8rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .search-input-header input { background: none; border: none; color: #fff; font-size: 1.1rem; width: 100%; outline: none; }
        .search-results-list { max-height: 380px; overflow-y: auto; padding: 0.8rem; }
        .search-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc { position: sticky; top: 56px; height: calc(100vh - 56px); padding: 2rem 1.5rem; font-size: 0.82rem; }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; }
    </style>
</head>
<body>
    <header>
        <div class="brand-group">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span style="font-weight: 800; font-size: 0.95rem;">AIDD Enterprise Suite v4.0</span>
            <span class="brand-badge">Documentação Oficial</span>
        </div>
        <div>
            <a href="/" class="btn">Aplicação</a>
            <a href="/docs" target="_blank" class="btn btn-primary">Swagger /docs</a>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="search-trigger" onclick="abrirBusca()">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Pesquisar na suíte...
                </div>
                <kbd>Ctrl K</kbd>
            </div>
            <ul class="sidebar-nav" id="sidebar-nav-list"></ul>
        </aside>

        <main class="content">
            <div class="breadcrumb" id="breadcrumb-box">Docs > Visão da Suíte</div>
            <h1 class="doc-title" id="page-title">Carregando...</h1>
            <p class="doc-subtitle" id="page-subtitle"></p>
            <div id="page-content-area"></div>
        </main>

        <aside class="toc">
            <div class="toc-title">Nesta Página</div>
            <a href="#overview" class="toc-link">Visão Geral</a>
            <a href="#rules" class="toc-link">Regras Cross-Domain</a>
            <a href="#modules" class="toc-link">Módulos Verticais</a>
        </aside>
    </div>

    <div class="modal-search" id="search-modal" onclick="fecharBusca(event)">
        <div class="search-container" onclick="event.stopPropagation()">
            <div class="search-input-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="modal-search-input" placeholder="Pesquisar em toda a documentação da suíte..." oninput="filtrarResultadosBusca(this.value)">
                <kbd style="color: var(--text-muted); font-size: 0.75rem; background: rgba(255,255,255,0.06); padding: 0.2rem 0.5rem; border-radius: 4px;">ESC</kbd>
            </div>
            <div class="search-results-list" id="search-results-box"></div>
        </div>
    </div>

    <script>
        const docPages = [{"id": "intro", "cat": "Visão da Suíte", "title": "AIDD Enterprise Suite v4.0", "subtitle": "Apresentação executiva da plataforma corporativa com 5 domínios integrados.", "content": "\n            <div class=\"callout tip\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/></svg>\n                <div>\n                    <strong>Padrão Monolítico Modular AIDD v4.0:</strong> Sistema completo unificando CRM, ERP, Helpdesk, Cursos e Catálogo operando sobre EventBus desacoplado e banco de dados SQLite WAL.\n                </div>\n            </div>\n\n            <h2>O Que Torna a Suíte Exclusiva</h2>\n            <p>Diferente de sistemas isolados que necessitam de integrações frágeis por fora, a <strong>AIDD Enterprise Suite v4.0</strong> une todos os módulos em um único núcleo de alta velocidade, onde cada ação em uma ponta (ex: fechar um contrato no CRM) repercute imediatamente nas demais áreas (lançamento no ERP e notificação no Helpdesk).</p>\n        "}, {"id": "cross_domain", "cat": "Orquestração & Eventos", "title": "EventBus Cross-Domain", "subtitle": "Regras de orquestração assíncrona entre módulos verticais.", "content": "\n            <h2>Regras de Negócio Cruzadas</h2>\n            <ul>\n                <li><strong>Regra 1 (CRM ➔ ERP):</strong> Ao arrastar um Lead para o estágio <em>Fechado / Ganho</em>, o EventBus dispara <code>lead_ganho</code> e gera uma Conta a Receber no ERP automaticamente.</li>\n                <li><strong>Regra 2 (Catálogo ➔ ERP):</strong> Ao finalizar um pedido no Catálogo, o evento <code>pedido_criado</code> registra a receita realizada no fluxo de caixa.</li>\n                <li><strong>Regra 3 (Helpdesk ➔ Webhooks):</strong> Abertura de chamados críticos P1 dispara notificações imediatas para orquestradores de automação n8n.</li>\n            </ul>\n        "}, {"id": "modules_catalog", "cat": "Catálogo de Módulos", "title": "Módulos Integrados", "subtitle": "Visão técnica dos 5 módulos verticais autônomos.", "content": "\n            <h2>1. CRM Omnichannel</h2>\n            <p>Kanban com Drag & Drop nativo, Lead Scoring (0-100), estimativa de receita e Full-CRUD de contatos.</p>\n\n            <h2>2. ERP Financeiro & Fiscal</h2>\n            <p>Controle de contas a pagar e receber, demonstrativo DRE simplificado e alternância de status em 1-Clique.</p>\n\n            <h2>3. Central de Helpdesk</h2>\n            <p>Triagem com protocolo UUID, categorização P1 a P4 e cronômetro de SLA regressivo.</p>\n\n            <h2>4. Área de Membros & Cursos</h2>\n            <p>Player de aulas, controle de progresso e checkout de assinaturas com ativação em tempo real.</p>\n\n            <h2>5. Catálogo Digital</h2>\n            <p>Catálogo de produtos com checkout transparente e integração com pedidos WhatsApp.</p>\n        "}];
        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca() {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') fecharBusca();
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
</body>
</html>
