<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDD Enterprise Suite Docs — Central Oficial AIDD v4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: #05070d;
            --surface: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --code-bg: #050811;
            --callout-bg: rgba(59, 130, 246, 0.08);
            --callout-border: rgba(59, 130, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            height: 56px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }
        .brand-group { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; }
        .brand-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--primary-light);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
        }
        .nav-actions { display: flex; align-items: center; gap: 0.8rem; }
        .btn {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .layout-container {
            display: grid;
            grid-template-columns: 280px 1fr 240px;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
        }

        aside.sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding: 1.2rem 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .search-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 0.55rem 0.8rem;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .search-trigger kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }
        .sidebar-nav { list-style: none; }
        .nav-cat { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.8rem 0.6rem 0.3rem 0.6rem; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 0.86rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-light);
        }

        main.content {
            padding: 3.5rem 4rem;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }
        .breadcrumb {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .doc-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; }
        .doc-subtitle { font-size: 1.15rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 2rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 0.98rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.2rem; }
        ul { padding-left: 1.4rem; margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.7; }
        li { margin-bottom: 0.4rem; }

        .callout {
            background: var(--callout-bg);
            border: 1px solid var(--callout-border);
            border-radius: 12px;
            padding: 1.2rem 1.4rem;
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin: 1.5rem 0; }
        .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem; }
        .feature-card h4 { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; color: #fff; }
        .feature-card p { font-size: 0.88rem; color: var(--text-muted); margin: 0; line-height: 1.5; }

        .code-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin: 1.5rem 0;
        }
        .code-tab-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-tab-title { font-size: 0.78rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); }
        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-copy:hover { background: var(--primary); }
        pre { padding: 1.2rem; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.86rem; line-height: 1.6; color: #e2e8f0; }

        .ascii-diagram { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; line-height: 1.3; overflow-x: auto; color: var(--primary-light); }
        .badges-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
        .badge-tag { background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        .doc-nav-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            gap: 1.5rem;
        }
        .nav-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .nav-card-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .nav-card-title { font-size: 1rem; font-weight: 800; color: #fff; margin-top: 0.3rem; }

        .modal-search {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 12vh;
            z-index: 100;
        }
        .search-container {
            background: #080c18;
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }
        .search-input-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .search-input-header input {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
        }
        .search-results-list {
            max-height: 380px;
            overflow-y: auto;
            padding: 0.8rem;
        }
        .search-item {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc {
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            padding: 2rem 1.5rem;
            font-size: 0.82rem;
        }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; letter-spacing: 0.05em; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; transition: color 0.15s; }
        .toc-link:hover { color: var(--primary-light); }
    </style>
</head>
<body>

    <header>
        <div class="brand-group">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span style="font-weight: 800; font-size: 0.95rem;">AIDD Enterprise Suite Docs</span>
            <span class="brand-badge">v4.0</span>
        </div>
        <div class="nav-actions">
            <a href="/" class="btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Super-App
            </a>
            <a href="/docs" target="_blank" class="btn btn-primary">Swagger /docs</a>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="search-trigger" onclick="abrirBusca()">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Pesquisar docs...
                </div>
                <kbd>Ctrl K</kbd>
            </div>

            <ul class="sidebar-nav" id="sidebar-nav-list">
            </ul>
        </aside>

        <main class="content">
            <div class="breadcrumb" id="breadcrumb-box">Docs > Comece Aqui</div>
            <h1 class="doc-title" id="page-title">Carregando...</h1>
            <p class="doc-subtitle" id="page-subtitle"></p>

            <div id="page-content-area"></div>

            <div class="doc-nav-footer">
                <div class="nav-card" id="prev-card" onclick="irParaPaginaRelativa(-1)" style="visibility: hidden;">
                    <div class="nav-card-label">Anterior</div>
                    <div class="nav-card-title" id="prev-title">Página Anterior</div>
                </div>
                <div class="nav-card" id="next-card" onclick="irParaPaginaRelativa(1)" style="text-align: right;">
                    <div class="nav-card-label">Próximo</div>
                    <div class="nav-card-title" id="next-title">Próxima Página</div>
                </div>
            </div>
        </main>

        <aside class="toc">
            <div class="toc-title">Nesta Página</div>
            <div id="toc-links-area">
                <a href="#overview" class="toc-link">Visão Geral</a>
                <a href="#code-sample" class="toc-link">Código & APIs</a>
                <a href="#webhooks" class="toc-link">Webhooks & Eventos</a>
            </div>
        </aside>
    </div>

    <div class="modal-search" id="search-modal" onclick="fecharBusca(event)">
        <div class="search-container" onclick="event.stopPropagation()">
            <div class="search-input-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="modal-search-input" placeholder="Pesquisar em toda a documentação..." oninput="filtrarResultadosBusca(this.value)">
                <kbd style="color: var(--text-muted); font-size: 0.75rem; background: rgba(255,255,255,0.06); padding: 0.2rem 0.5rem; border-radius: 4px;">ESC</kbd>
            </div>
            <div class="search-results-list" id="search-results-box"></div>
        </div>
    </div>

    <script>
        const docPages = [{"id": "intro", "cat": "Comece Aqui", "title": "O que é a AIDD Enterprise Suite?", "subtitle": "Visão geral: arquitetura cross-domain, integração por eventos e governança.", "content": "\n                <div class=\"callout tip\">\n                    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/></svg>\n                    <div>\n                        <strong>AIDD v4.0 Cross-Project Suite:</strong> Esta aplicação unifica 5 fatias de negócio corporativas (CRM, ERP, Helpdesk, Cursos e Catálogo) operando com comunicação cruzada via EventBus.\n                    </div>\n                </div>\n\n                <h2>Propósito da Suíte</h2>\n                <p>A <strong>AIDD Enterprise Suite</strong> resolve o problema de silos de software corporativos integrando os fluxos comerciais, financeiros e de atendimento em tempo real com zero fricção.</p>\n\n                <h2>Principais Capacidades</h2>\n                <div class=\"feature-grid\">\n                    <div class=\"feature-card\">\n                        <h4>Cross-Domain Orchestration</h4>\n                        <p>Ações no CRM (fechar venda) geram automaticamente lançamentos no ERP e liberam produtos.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <h4>Super-App Single Interface</h4>\n                        <p>Navegue entre os 5 módulos com um único clique sem trocar de página ou autenticação.</p>\n                    </div>\n                    <div class=\"feature-card\">\n                        <h4>Webhooks & n8n</h4>\n                        <p>Disparo unificado de eventos de todos os módulos para automações em background.</p>\n                    </div>\n                </div>\n            "}, {"id": "quickstart", "cat": "Comece Aqui", "title": "Instalação & Guia Rápido", "subtitle": "Como rodar a suíte completa localmente em menos de 5 segundos.", "content": "\n                <h2>Executando Localmente</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">Terminal / Shell</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code># 1. Navegue até a pasta da suíte\ncd C:\\Users\\trcnologia\\Desktop\\enterprise-suite-v4\n\n# 2. Inicie o servidor unificado\npython src/server.py\n\n# 3. Acesse no navegador\n# Super-App:   http://localhost:3000\n# Swagger API: http://localhost:3000/docs\n# Docs Portal: http://localhost:3000/docs/guia</code></pre>\n                </div>\n            "}, {"id": "architecture", "cat": "Arquitetura Cross-Project", "title": "Monólito Modular & Cross-Domain EventBus", "subtitle": "Como os 5 domínios conversam entre si sem acoplamento forte.", "content": "\n                <h2>Comunicação Cross-Domain</h2>\n                <p>Quando um evento ocorre em um domínio (ex: Lead ganho no CRM), o EventBus central notifica todos os domínios interessados de forma desacoplada.</p>\n\n                <div class=\"diagram-box\">\n                    <pre class=\"ascii-diagram\">\n┌─────────────────────────────────────────────────────────────┐\n│                    CENTRAL CROSS-DOMAIN                     │\n├─────────────┬─────────────┬─────────────┬───────────────────┤\n│ CRM VENDAS  │ ERP FINANC  │ HELPDESK    │ MEMBROS & CURSOS  │\n└──────┬──────┴──────▲──────┴──────▲──────┴─────────▲─────────┘\n       │             │             │                │\n       └─────────────┴──────┬──────┴────────────────┘\n                            ▼\n               CENTRAL EVENTBUS DISPATCHER\n                    </pre>\n                </div>\n            "}, {"id": "mod-crm", "cat": "Domínios Integrados", "title": "Módulo: CRM Omnichannel & Funil Kanban", "subtitle": "Gestão de leads com pontuação (Lead Scoring 0-100), funil Drag & Drop e disparo cross-domain.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Gestão de leads com pontuação (Lead Scoring 0-100), funil Drag & Drop e disparo cross-domain.</p>\n\n                <h2>Eventos Emitidos</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">crm.lead_criado</span><span class=\"badge-tag\">cross_domain.crm_to_erp</span>\n                </div>\n\n                <h2>Exemplo de Chamada REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X POST http://localhost:3000/api/crm/pipeline/mover \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"lead_id\": 1,\n  \"novo_status\": \"ganho\"\n}'</code></pre>\n                </div>\n            "}, {"id": "mod-erp", "cat": "Domínios Integrados", "title": "Módulo: ERP Financeiro & DRE", "subtitle": "Contas a pagar/receber, conciliação e criação automática de lançamentos via eventos de vendas.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Contas a pagar/receber, conciliação e criação automática de lançamentos via eventos de vendas.</p>\n\n                <h2>Eventos Emitidos</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">erp.conta_criada</span>\n                </div>\n\n                <h2>Exemplo de Chamada REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X POST http://localhost:3000/api/erp/contas/salvar \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"descricao\": \"Venda Software\",\n  \"tipo\": \"receita\",\n  \"valor\": 50000,\n  \"data_vencimento\": \"2026-09-15\"\n}'</code></pre>\n                </div>\n            "}, {"id": "mod-helpdesk", "cat": "Domínios Integrados", "title": "Módulo: Central de Helpdesk & SLA", "subtitle": "Gestão de tickets com protocolo UUID e contagem regressiva de SLA por criticidade P1 a P4.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Gestão de tickets com protocolo UUID e contagem regressiva de SLA por criticidade P1 a P4.</p>\n\n                <h2>Eventos Emitidos</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">helpdesk.ticket_aberto</span>\n                </div>\n\n                <h2>Exemplo de Chamada REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X POST http://localhost:3000/api/helpdesk/tickets/salvar \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"assunto\": \"Lentid\\u00e3o\",\n  \"prioridade\": \"P1\"\n}'</code></pre>\n                </div>\n            "}, {"id": "mod-membros", "cat": "Domínios Integrados", "title": "Módulo: Membros & Cursos VIP", "subtitle": "Área de membros, player de vídeo e certificados.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Área de membros, player de vídeo e certificados.</p>\n\n                <h2>Eventos Emitidos</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">membros.assinatura_ativada</span>\n                </div>\n\n                <h2>Exemplo de Chamada REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X GET http://localhost:3000/api/membros/cursos \\\n  -H \"Content-Type: application/json\" \\\n  -d '{}'</code></pre>\n                </div>\n            "}, {"id": "mod-catalogo", "cat": "Domínios Integrados", "title": "Módulo: Catálogo & E-commerce", "subtitle": "Catálogo digital com checkout WhatsApp e liquidação Pix.", "content": "\n                <h2>Visão do Módulo</h2>\n                <p>Catálogo digital com checkout WhatsApp e liquidação Pix.</p>\n\n                <h2>Eventos Emitidos</h2>\n                <div class=\"badges-box\">\n                    <span class=\"badge-tag\">catalogo.pedido_gerado</span>\n                </div>\n\n                <h2>Exemplo de Chamada REST</h2>\n                <div class=\"code-box\">\n                    <div class=\"code-tab-header\">\n                        <div class=\"code-tab-title\">cURL</div>\n                        <button class=\"btn-copy\" onclick=\"copiarCodigo(this)\">Copiar</button>\n                    </div>\n                    <pre><code>curl -X GET http://localhost:3000/api/catalogo/produtos \\\n  -H \"Content-Type: application/json\" \\\n  -d '{}'</code></pre>\n                </div>\n            "}, {"id": "webhooks", "cat": "Automações & DevOps", "title": "Webhooks & Integração com n8n", "subtitle": "Disparo em background de eventos para a esteira de automações.", "content": "\n            <h2>Webhooks Nativos</h2>\n            <p>Disparo automático de HTTP POST assíncrono para seu orquestrador n8n.</p>\n            <div class=\"badges-box\">\n                <span class=\"badge-tag\">cross_domain.crm_to_erp</span><span class=\"badge-tag\">crm.lead_criado</span><span class=\"badge-tag\">erp.conta_criada</span><span class=\"badge-tag\">helpdesk.ticket_aberto</span>\n            </div>\n        "}];
        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;

            const prevCard = document.getElementById('prev-card');
            const nextCard = document.getElementById('next-card');

            if (index > 0) {
                prevCard.style.visibility = 'visible';
                document.getElementById('prev-title').innerText = docPages[index - 1].title;
            } else {
                prevCard.style.visibility = 'hidden';
            }

            if (index < docPages.length - 1) {
                nextCard.style.visibility = 'visible';
                document.getElementById('next-title').innerText = docPages[index + 1].title;
            } else {
                nextCard.style.visibility = 'hidden';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function irParaPaginaRelativa(delta) {
            carregarPagina(currentPageIndex + delta);
        }

        function copiarCodigo(btn) {
            const code = btn.closest('.code-box').querySelector('pre code').innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = 'Copiado!';
            setTimeout(() => { btn.innerText = 'Copiar'; }, 2000);
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca(e) {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') {
                fecharBusca();
            }
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
</body>
</html>
