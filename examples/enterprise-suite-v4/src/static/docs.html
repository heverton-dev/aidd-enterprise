<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --sidebar-bg: #050b18;
            --surface: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #030712;
            --callout-bg: rgba(59, 130, 246, 0.08);
            --callout-border: rgba(59, 130, 246, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { height: 56px; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
        .brand-group { display: flex; align-items: center; gap: 0.8rem; }
        .brand-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 9999px; }
        
        .btn { padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .layout-container { display: grid; grid-template-columns: 290px 1fr 240px; margin-top: 56px; min-height: calc(100vh - 56px); }
        @media (max-width: 1100px) { .layout-container { grid-template-columns: 260px 1fr; } aside.toc { display: none; } }
        @media (max-width: 768px) { .layout-container { grid-template-columns: 1fr; } aside.sidebar { display: none; } }

        aside.sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 1.2rem 0.8rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .search-trigger { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); padding: 0.55rem 0.8rem; border-radius: 8px; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; }
        .search-trigger kbd { background: rgba(255, 255, 255, 0.08); padding: 0.1rem 0.4rem; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
        
        .sidebar-nav { list-style: none; }
        .nav-cat { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.8rem 0.6rem 0.3rem 0.6rem; }
        .nav-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.7rem; border-radius: 8px; color: #cbd5e1; font-size: 0.86rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.15s; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }

        main.content { padding: 3.5rem 4rem; max-width: 900px; margin: 0 auto; width: 100%; }
        .breadcrumb { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .doc-title { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; color: #fff; }
        .doc-subtitle { font-size: 1.15rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        h2 { font-size: 1.5rem; font-weight: 800; margin-top: 2.2rem; margin-bottom: 1rem; color: #fff; letter-spacing: -0.02em; }
        p { font-size: 0.98rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.2rem; }
        ul, ol { padding-left: 1.4rem; margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.7; }
        li { margin-bottom: 0.4rem; }

        .doc-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0 2rem 0; font-size: 0.88rem; }
        .doc-table th, .doc-table td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        .doc-table th { background: rgba(255, 255, 255, 0.02); font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .doc-table td code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--primary-light); background: rgba(59, 130, 246, 0.1); padding: 0.15rem 0.35rem; border-radius: 4px; }

        pre.code-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; line-height: 1.6; color: #e2e8f0; overflow-x: auto; margin: 1.5rem 0; }

        .callout { background: var(--callout-bg); border: 1px solid var(--callout-border); border-radius: 12px; padding: 1.2rem 1.4rem; margin: 1.5rem 0; display: flex; gap: 1rem; align-items: flex-start; }
        .callout.tip { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3); }

        .modal-search { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 100; }
        .search-container { background: #080c18; border: 1px solid var(--border-hover); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); overflow: hidden; }
        .search-input-header { display: flex; align-items: center; gap: 0.8rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .search-input-header input { background: none; border: none; color: #fff; font-size: 1.1rem; width: 100%; outline: none; }
        .search-results-list { max-height: 380px; overflow-y: auto; padding: 0.8rem; }
        .search-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc { position: sticky; top: 56px; height: calc(100vh - 56px); padding: 2rem 1.5rem; font-size: 0.82rem; }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; letter-spacing: 0.05em; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; transition: color 0.15s; }
        .toc-link:hover { color: var(--primary-light); }
    </style>
</head>

    <script>
        const docPages = [{"id": "arch_overview", "cat": "1. Arquitetura da Suíte", "title": "Visão Geral da Arquitetura v4.0", "subtitle": "Estrutura do Monólito Modular de alta performance integrando 5 domínios corporativos.", "content": "\n            <div class=\"callout tip\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2.2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/></svg>\n                <div>\n                    <strong>Padrão de Arquitetura AIDD Enterprise Suite v4.0:</strong> Sistema corporativo construído no modelo Monólito Modular orientado a domínios (Domain-Driven Design), com comunicação desacoplada via EventBus central, banco de dados SQLite com Journaling WAL de alta concorrência e Servidor Nativo MCP (Model Context Protocol).\n                </div>\n            </div>\n\n            <h2>Princípios de Design da Suíte</h2>\n            <p>O AIDD v4.0 resolve a fragmentação de ferramentas corporativas ao unificar cinco verticais críticas de negócios em um único Super-App de altíssima velocidade, mantendo total separação de responsabilidades (SoC) entre cada módulo:</p>\n            \n            <table class=\"doc-table\">\n                <thead>\n                    <tr>\n                        <th>Camada</th>\n                        <th>Tecnologia & Padrão</th>\n                        <th>Responsabilidade</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    <tr>\n                        <td><strong>Super-App Shell</strong></td>\n                        <td>HTML5 / CSS Modern Glass / Vanilla JS</td>\n                        <td>Barra de topo unificada, alternador de módulos (App Switcher), modais dinâmicos e controle de estado reativo.</td>\n                    </tr>\n                    <tr>\n                        <td><strong>Core Engine</strong></td>\n                        <td>Python 3 Standard Threaded Server</td>\n                        <td>Roteamento dinâmico REST, despacho de eventos assíncronos, motor MCP JSON-RPC 2.0 e geração de OpenAPI 3.1.</td>\n                    </tr>\n                    <tr>\n                        <td><strong>EventBus Cross-Domain</strong></td>\n                        <td>Pub/Sub em Memória</td>\n                        <td>Propagação de eventos de negócio cruzados (ex: CRM ➔ ERP e Catálogo ➔ ERP) sem acoplamento direto de código.</td>\n                    </tr>\n                    <tr>\n                        <td><strong>Banco de Dados</strong></td>\n                        <td>SQLite 3 com PRAGMA WAL</td>\n                        <td>Persistência relacional com integridade referencial, bloqueio otimizado para concorrência e inicialização de schemas 100% idempotente.</td>\n                    </tr>\n                    <tr>\n                        <td><strong>Nativo MCP</strong></td>\n                        <td>Model Context Protocol JSON-RPC</td>\n                        <td>Ponte universal para agentes de IA (Claude, Cursor, Antigravity, Zed) executarem ações reais no sistema.</td>\n                    </tr>\n                </tbody>\n            </table>\n\n            <h2>Estrutura de Pastas do Projeto</h2>\n            <pre class=\"code-box\">enterprise-suite-v4/\n├── src/\n│   ├── core/\n│   │   ├── database.py       # Engine SQLite WAL com Thread-Safety\n│   │   ├── events.py         # Barramento de Eventos Pub/Sub Central\n│   │   ├── mcp_server.py     # Servidor Nativo Universal MCP (JSON-RPC 2.0)\n│   │   ├── models.py         # Schemas DDL e Migrations Idempotentes\n│   │   ├── openapi.py        # Swagger API Reference Studio Dinâmico\n│   │   └── webhooks.py       # Dispatcher de Webhooks para n8n / Automações\n│   ├── modules/\n│   │   ├── crm/              # Módulo Vertical de Vendas & Pipeline\n│   │   ├── erp/              # Módulo Vertical Financeiro & DRE\n│   │   ├── helpdesk/         # Módulo Vertical de Suporte & SLAs\n│   │   ├── membros/          # Módulo Vertical de Cursos & Assinaturas\n│   │   └── catalogo/         # Módulo Vertical de Produtos & Checkout\n│   ├── static/\n│   │   ├── index.html        # Interface Super-App com Full-CRUD e Modais\n│   │   └── docs.html         # Portal Oficial de Documentação Técnica\n│   └── server.py             # Servidor HTTP Integrado na Porta 3000\n├── suite.db                  # Banco de Dados Unificado em Produção\n├── mcp.json                  # Configuração de Conexão MCP para Agentes\n└── claude_desktop_config.json # Configuração Pronta para Claude Desktop</pre>\n        "}, {"id": "module_crm", "cat": "2. Módulos Verticais", "title": "Módulo CRM Vendas & Pipeline", "subtitle": "Gestão comercial omnichannel, Pipeline Kanban com Drag & Drop, Lead Scoring e automação comercial.", "content": "\n            <h2>Visão Geral do Módulo de Vendas</h2>\n            <p>O módulo de <strong>CRM Comercial</strong> centraliza o relacionamento com clientes e decisores, automatizando a qualificação de oportunidades e a progressão do funil de vendas através de uma interface Kanban visual.</p>\n\n            <h2>Estágios do Funil de Vendas (Kanban)</h2>\n            <ul>\n                <li><strong>Novos Leads:</strong> Contatos recém-capturados via formulário, API ou automação externa.</li>\n                <li><strong>Qualificados:</strong> Leads com decisor identificado, score comercial &gt; 60 e perfil ICP validado.</li>\n                <li><strong>Proposta Enviada:</strong> Oportunidades com proposta comercial formalizada e em avaliação pelo cliente.</li>\n                <li><strong>Em Negociação:</strong> Ajustes de escopo, cláusulas contratuais e condições de pagamento.</li>\n                <li><strong>Fechado / Ganho:</strong> Contrato assinado. <em>Dispara o evento <code>lead_ganho</code> no EventBus para faturamento imediato no ERP</em>.</li>\n            </ul>\n\n            <h2>Lead Scoring Inteligente (0 a 100)</h2>\n            <p>Cada lead recebe uma pontuação calculada com base no porte da empresa, orçamento estimado e nível de urgência:</p>\n            <ul>\n                <li><strong>Score 80–100 (Hot Lead):</strong> Decisor C-Level com orçamento imediato. Prioridade máxima na fila de atendimento.</li>\n                <li><strong>Score 50–79 (Warm Lead):</strong> Oportunidade madura em fase de alinhamento técnico.</li>\n                <li><strong>Score 0–49 (Cold Lead):</strong> Contato em fase inicial de nutrição.</li>\n            </ul>\n\n            <h2>Endpoints da API REST do CRM</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Método</th><th>Rota</th><th>Descrição</th></tr>\n                </thead>\n                <tbody>\n                    <tr><td><code>GET</code></td><td><code>/api/crm/pipeline</code></td><td>Retorna todos os estágios do Kanban com agregação do valor total por coluna.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/crm/leads/salvar</code></td><td>Cadastra novo lead ou edita contato existente. Valida nome, e-mail e telefone.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/crm/pipeline/mover</code></td><td>Move o card de estágio (Drag & Drop). Dispara o EventBus se for 'ganho'.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/crm/leads/excluir</code></td><td>Exclui permanentemente o lead da base.</td></tr>\n                </tbody>\n            </table>\n        "}, {"id": "module_erp", "cat": "2. Módulos Verticais", "title": "Módulo ERP Financeiro & DRE", "subtitle": "Controle de contas a pagar e receber, fluxo de caixa em tempo real, liquidação 1-clique e DRE.", "content": "\n            <h2>Visão Geral do ERP Financeiro</h2>\n            <p>O módulo de <strong>ERP Financeiro</strong> controla a liquidez corporativa, registrando as obrigações e receitas da empresa com cálculo automático de saldos realizados e projetados.</p>\n\n            <h2>Plano de Contas & Categorias</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Tipo</th><th>Categorias Padrão</th><th>Impacto Contábil</th></tr>\n                </thead>\n                <tbody>\n                    <tr>\n                        <td><strong>Receitas</strong></td>\n                        <td>Vendas CRM, E-commerce Catálogo, Mensalidades VIP, Consultoria</td>\n                        <td>Entrada no Caixa (+). Incrementa o Saldo Realizado quando liquidada.</td>\n                    </tr>\n                    <tr>\n                        <td><strong>Despesas</strong></td>\n                        <td>Servidores / Cloud, Licenças de Software, Pessoal, Tributos, Marketing</td>\n                        <td>Saída do Caixa (-). Deduz do Saldo Realizado no momento da baixa.</td>\n                    </tr>\n                </tbody>\n            </table>\n\n            <h2>Regras de Liquidação (1-Clique Status)</h2>\n            <p>Ao clicar no botão de status de qualquer lançamento na tabela financeira:</p>\n            <ul>\n                <li>Se a conta estiver <code>pendente</code>, ela é imediatamente convertida para <code>pago</code>, recalculando a DRE.</li>\n                <li>Se a conta estiver <code>pago</code>, ela retorna para <code>pendente</code> com estorno no fluxo de caixa.</li>\n            </ul>\n\n            <h2>Endpoints da API REST do ERP</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Método</th><th>Rota</th><th>Descrição</th></tr>\n                </thead>\n                <tbody>\n                    <tr><td><code>GET</code></td><td><code>/api/erp/contas</code></td><td>Lista todos os lançamentos contábeis ordenados por vencimento.</td></tr>\n                    <tr><td><code>GET</code></td><td><code>/api/erp/fluxo-caixa</code></td><td>Calcula saldo realizado (receitas pagas - despesas pagas) e projetado.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/erp/contas/salvar</code></td><td>Registra nova conta a pagar ou receber com categoria e entidade.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/erp/contas/alternar-status</code></td><td>Alterna status de liquidação (Pago / Pendente) atomicamente.</td></tr>\n                    <tr><td><code>POST</code></td><td><code>/api/erp/contas/excluir</code></td><td>Remove lançamento contábil.</td></tr>\n                </tbody>\n            </table>\n        "}, {"id": "module_helpdesk", "cat": "2. Módulos Verticais", "title": "Módulo Central de Helpdesk & SLA", "subtitle": "Fila de chamados técnicos, protocolos UUID, classificação de criticidade P1/P2/P3 e gestão de SLA.", "content": "\n            <h2>Visão Geral do Helpdesk</h2>\n            <p>A <strong>Central de Helpdesk</strong> gerencia incidentes técnicos e requisições de serviço com garantia de níveis de serviço (SLA) baseados na criticidade do chamado.</p>\n\n            <h2>Matriz de Criticidade e Prazos de SLA</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Prioridade</th><th>Nível de Severidade</th><th>Prazo Máximo de Resolução (SLA)</th></tr>\n                </thead>\n                <tbody>\n                    <tr>\n                        <td><span style=\"color:#ef4444; font-weight:800;\">P1 (Crítica)</span></td>\n                        <td>Queda total de sistema, indisponibilidade de pagamentos ou falha de segurança.</td>\n                        <td><strong>2 Horas</strong> (Notifica webhooks externos imediatamente)</td>\n                    </tr>\n                    <tr>\n                        <td><span style=\"color:#f59e0b; font-weight:800;\">P2 (Alta)</span></td>\n                        <td>Degradação parcial de desempenho ou falha em módulo secundário.</td>\n                        <td><strong>4 Horas</strong></td>\n                    </tr>\n                    <tr>\n                        <td><span style=\"color:#3b82f6; font-weight:800;\">P3 (Normal)</span></td>\n                        <td>Dúvidas de configuração, novas solicitações ou ajustes de interface.</td>\n                        <td><strong>24 Horas</strong></td>\n                    </tr>\n                </tbody>\n            </table>\n\n            <h2>Ciclo de Vida do Chamado</h2>\n            <p>Os chamados transitam através de 3 estados com o botão de avanço 1-clique:</p>\n            <ol>\n                <li><strong>Aberto:</strong> Chamado recém-criado com protocolo <code>TICK-XXXXXX</code> aguardando triagem.</li>\n                <li><strong>Em Andamento:</strong> Engenheiro de suporte trabalhando ativamente na resolução.</li>\n                <li><strong>Resolvido:</strong> Incidente solucionado e arquivado.</li>\n            </ol>\n        "}, {"id": "module_membros", "cat": "2. Módulos Verticais", "title": "Módulo Área de Membros & Cursos VIP", "subtitle": "Plataforma de ensino com grade curricular, contagem de aulas práticas e gestão de planos de assinatura.", "content": "\n            <h2>Visão Geral da Área de Membros</h2>\n            <p>O módulo de <strong>Membros & Cursos</strong> disponibiliza o ambiente de capacitação técnica em Engenharia Agêntica, Inteligência Artificial e Arquitetura de Software com controle de acesso por assinatura.</p>\n\n            <h2>Estrutura dos Cursos Oficiais</h2>\n            <ul>\n                <li><strong>Formação Engenharia Agêntica (24 Aulas):</strong> Do design de subagentes autônomos ao isolamento de contexto e economia de tokens.</li>\n                <li><strong>Arquitetura de Monólitos Modulares (18 Aulas):</strong> Desacoplamento via EventBus, Clean Architecture e DDLs idempotentes.</li>\n                <li><strong>Model Context Protocol (MCP) Avançado (12 Aulas):</strong> Criação de servidores MCP JSON-RPC sobre STDIO e HTTP para Claude Desktop e Cursor.</li>\n            </ul>\n\n            <h2>Gestão de Assinaturas</h2>\n            <p>O sistema suporta contratação de planos VIP (Mensal, Anual e Enterprise) com ativação de usuário imediata no banco SQLite.</p>\n        "}, {"id": "module_catalogo", "cat": "2. Módulos Verticais", "title": "Módulo Catálogo Digital & Pedidos", "subtitle": "Vitrine digital de produtos e licenças, carrinho de compras e integração direta com fluxo de caixa.", "content": "\n            <h2>Visão Geral do Catálogo</h2>\n            <p>O módulo de <strong>Catálogo Digital</strong> funciona como a frente de e-commerce e vendas diretas, permitindo a compra simplificada de produtos com baixa automática no estoque e lançamento de receita no ERP.</p>\n\n            <h2>Integração Automática com o ERP</h2>\n            <p>Quando um cliente clica em <strong>\"Comprar Agora\"</strong> no Catálogo:</p>\n            <ol>\n                <li>O pedido é registrado na tabela <code>pedidos</code> com status <code>pago</code>.</li>\n                <li>O EventBus emite o evento <code>pedido_criado</code>.</li>\n                <li>O ERP escuta o evento e insere automaticamente uma receita realizada no razão contábil.</li>\n            </ol>\n        "}, {"id": "eventbus_webhooks", "cat": "3. Orquestração & Automação", "title": "EventBus Cross-Domain & Webhooks", "subtitle": "Barramento assíncrono de eventos, regras de negócio cruzadas e dispatcher de webhooks para n8n.", "content": "\n            <h2>Barramento Central de Eventos (EventBus)</h2>\n            <p>O EventBus central (`src/core/events.py`) implementa o padrão Observer em memória, garantindo que nenhum módulo acesse diretamente o código ou tabelas de outro módulo sem passar por eventos tipados:</p>\n\n            <div class=\"callout\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>\n                <div>\n                    <strong>Regra Central 1 (CRM ➔ ERP):</strong> Ao emitir <code>lead_ganho</code>, uma Conta a Receber é criada no ERP com vencimento em 15 dias e categoria 'Vendas CRM'.\n                </div>\n            </div>\n\n            <div class=\"callout\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>\n                <div>\n                    <strong>Regra Central 2 (Catálogo ➔ ERP):</strong> Ao emitir <code>pedido_criado</code>, uma receita liquidada é gerada imediatamente no razão financeiro.\n                </div>\n            </div>\n\n            <h2>Dispatcher de Webhooks para n8n / Zapier</h2>\n            <p>O sistema possui um despachante assíncrono que envia payloads JSON via HTTP POST para qualquer endpoint configurado na tela de Administração (ex: n8n, Make, Webhook.site).</p>\n        "}, {"id": "mcp_universal", "cat": "3. Orquestração & Automação", "title": "Servidor Nativo Universal MCP", "subtitle": "Integração oficial via Model Context Protocol para Claude Desktop, Cursor, Antigravity, Zed e Windsurf.", "content": "\n            <h2>O Que é o Servidor MCP da Suíte</h2>\n            <p>O <strong>Model Context Protocol (MCP)</strong> é o padrão aberto universal que permite a modelos de linguagem (LLMs) executarem comandos e consultarem bancos de dados corporativos de forma segura e padronizada.</p>\n\n            <h2>Suporte a Transportes Duplos</h2>\n            <ul>\n                <li><strong>Transporte STDIO (Padrão de Desktop):</strong> Utilizado pelo Claude Desktop, Cursor e Antigravity através de comunicação via linha de comando (`src/core/mcp_server.py`).</li>\n                <li><strong>Transporte HTTP JSON-RPC 2.0 (Padrão Web):</strong> Disponível no endpoint <code>http://localhost:3000/mcp</code> com testador visual interativo.</li>\n            </ul>\n\n            <h2>Ferramentas MCP Registradas</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Ferramenta</th><th>Módulo</th><th>Ação Executada pela IA</th></tr>\n                </thead>\n                <tbody>\n                    <tr><td><code>crm_listar_pipeline</code></td><td>CRM Vendas</td><td>Retorna todos os leads agrupados por estágio com pontuação de score.</td></tr>\n                    <tr><td><code>crm_salvar_lead</code></td><td>CRM Vendas</td><td>Cadastra novo lead ou edita contato comercial.</td></tr>\n                    <tr><td><code>crm_mover_lead</code></td><td>CRM Vendas</td><td>Altera estágio do card e dispara faturamento no ERP se for 'ganho'.</td></tr>\n                    <tr><td><code>erp_obter_fluxo_caixa</code></td><td>ERP Financeiro</td><td>Consulta receitas pagas, despesas e saldo líquido realizado em BRL.</td></tr>\n                    <tr><td><code>erp_lancar_conta</code></td><td>ERP Financeiro</td><td>Insere lançamento contábil no razão da empresa.</td></tr>\n                    <tr><td><code>helpdesk_listar_tickets</code></td><td>Helpdesk</td><td>Consulta fila de chamados ordenados por prioridade e SLA.</td></tr>\n                    <tr><td><code>helpdesk_abrir_ticket</code></td><td>Helpdesk</td><td>Abre chamado de suporte com protocolo UUID e definição de SLA.</td></tr>\n                    <tr><td><code>catalogo_listar_produtos</code></td><td>Catálogo</td><td>Consulta lista de produtos disponíveis para venda.</td></tr>\n                </tbody>\n            </table>\n        "}, {"id": "api_reference_guide", "cat": "4. Referência de APIs & Desenvolvedores", "title": "Swagger Studio & OpenAPI 3.1", "subtitle": "Central de Referência de APIs em 3 colunas com testador interativo e gerador de snippets multi-linguagem.", "content": "\n            <h2>Central Swagger Studio (/docs)</h2>\n            <p>Inspirado nas documentações modernas de empresas como Stripe, Mintlify e Evolution Foundation, o <strong>Swagger API Reference Studio</strong> oferece uma experiência de desenvolvimento de alto nível:</p>\n            <ul>\n                <li><strong>Sidebar Dinâmica:</strong> Lista categorizada dos 18 endpoints com badges coloridos de métodos HTTP (`GET`, `POST`).</li>\n                <li><strong>Especificação Técnica Central:</strong> Tabelas completas de parâmetros, tipos de dados, obrigatoriedade e schemas de resposta.</li>\n                <li><strong>Interactive Playground Studio:</strong> Editor de JSON em tempo real com botão de execução direta e cálculo de latência em milissegundos.</li>\n                <li><strong>Gerador Multi-Linguagem:</strong> Geração instantânea de código em <code>cURL</code>, <code>JavaScript (Fetch)</code> e <code>Python (Requests)</code>.</li>\n            </ul>\n\n            <h2>Exportação OpenAPI 3.1.0</h2>\n            <p>O schema JSON completo da suíte pode ser consumido diretamente por ferramentas como Postman, Insomnia ou geradores de SDK através do endpoint <code>http://localhost:3000/openapi.json</code>.</p>\n        "}, {"id": "install_deploy", "cat": "5. Operações & Infraestrutura", "title": "Guia de Instalação, Execução & Deploy", "subtitle": "Instruções passo a passo para execução em desenvolvimento, ambientes Docker e produção.", "content": "\n            <h2>Requisitos de Sistema</h2>\n            <ul>\n                <li><strong>Python:</strong> Versão 3.10 ou superior (Utiliza exclusivamente a biblioteca padrão sem dependências pesadas externas).</li>\n                <li><strong>Sistema Operacional:</strong> Windows 10/11, Linux (Ubuntu/Debian) ou macOS.</li>\n                <li><strong>Porta de Rede:</strong> Porta <code>3000</code> livre para o servidor web e MCP.</li>\n            </ul>\n\n            <h2>Como Iniciar o Servidor Localmente</h2>\n            <pre class=\"code-box\"># 1. Acesse o diretório do projeto\ncd C:\\Users\\trcnologia\\Desktop\\enterprise-suite-v4\n\n# 2. Inicie o servidor unificado\npython src/server.py\n\n# 3. Acesse os endpoints no navegador:\n# - Super-App: http://localhost:3000\n# - Documentação: http://localhost:3000/docs/guia\n# - Swagger Studio: http://localhost:3000/docs\n# - Portal MCP: http://localhost:3000/mcp</pre>\n\n            <h2>Persistência & Backup do Banco de Dados</h2>\n            <p>Todos os dados da suíte ficam armazenados no arquivo <code>suite.db</code> na raiz do projeto. Para realizar backup, basta copiar o arquivo <code>suite.db</code> enquanto o servidor estiver operando, aproveitando o modo Write-Ahead Logging (WAL) do SQLite.</p>\n        "}];
        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;

            // Extrair H2 para o TOC lateral
            const h2Elements = document.getElementById('page-content-area').querySelectorAll('h2');
            const tocArea = document.getElementById('toc-links-area');
            let tocHtml = '';
            h2Elements.forEach((h2, i) => {
                const anchorId = 'section-' + i;
                h2.id = anchorId;
                tocHtml += '<a href="#' + anchorId + '" class="toc-link">' + h2.innerText + '</a>';
            });
            tocArea.innerHTML = tocHtml || '<span style="color: var(--text-muted);">Tópico único</span>';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca() {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') fecharBusca();
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
