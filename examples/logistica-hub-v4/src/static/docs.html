<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistica Hub Suite v4.0 — Documentacao Tecnica Oficial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --sidebar-bg: #050b18;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #030712;
            --callout-bg: rgba(59, 130, 246, 0.08);
            --callout-border: rgba(59, 130, 246, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { height: 56px; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
        .brand-group { display: flex; align-items: center; gap: 0.8rem; }
        .brand-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 9999px; }
        
        .btn { padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .layout-container { display: grid; grid-template-columns: 290px 1fr 240px; margin-top: 56px; min-height: calc(100vh - 56px); }
        @media (max-width: 1100px) { .layout-container { grid-template-columns: 260px 1fr; } aside.toc { display: none; } }
        @media (max-width: 768px) { .layout-container { grid-template-columns: 1fr; } aside.sidebar { display: none; } }

        aside.sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 1.2rem 0.8rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .search-trigger { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); padding: 0.55rem 0.8rem; border-radius: 8px; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; }
        .search-trigger kbd { background: rgba(255, 255, 255, 0.08); padding: 0.1rem 0.4rem; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
        
        .sidebar-nav { list-style: none; }
        .nav-cat { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.8rem 0.6rem 0.3rem 0.6rem; }
        .nav-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.7rem; border-radius: 8px; color: #cbd5e1; font-size: 0.86rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.15s; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }

        main.content { padding: 3.5rem 4rem; max-width: 900px; margin: 0 auto; width: 100%; }
        .breadcrumb { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .doc-title { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.8rem; color: #fff; }
        .doc-subtitle { font-size: 1.15rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        h2 { font-size: 1.5rem; font-weight: 800; margin-top: 2.2rem; margin-bottom: 1rem; color: #fff; }
        p { font-size: 0.98rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.2rem; }
        ul, ol { padding-left: 1.4rem; margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.7; }
        li { margin-bottom: 0.4rem; }

        .doc-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0 2rem 0; font-size: 0.88rem; }
        .doc-table th, .doc-table td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        .doc-table th { background: rgba(255, 255, 255, 0.02); font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .doc-table td code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--primary-light); background: rgba(59, 130, 246, 0.1); padding: 0.15rem 0.35rem; border-radius: 4px; }

        pre.code-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; line-height: 1.6; color: #e2e8f0; overflow-x: auto; margin: 1.5rem 0; }
        .callout { background: var(--callout-bg); border: 1px solid var(--callout-border); border-radius: 12px; padding: 1.2rem 1.4rem; margin: 1.5rem 0; display: flex; gap: 1rem; align-items: flex-start; }
        .callout.tip { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3); }

        .modal-search { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 100; }
        .search-container { background: #080c18; border: 1px solid var(--border-hover); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); overflow: hidden; }
        .search-input-header { display: flex; align-items: center; gap: 0.8rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .search-input-header input { background: none; border: none; color: #fff; font-size: 1.1rem; width: 100%; outline: none; }
        .search-results-list { max-height: 380px; overflow-y: auto; padding: 0.8rem; }
        .search-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; }
        .search-item:hover { background: rgba(59, 130, 246, 0.15); }
        .search-item-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .search-item-sub { font-size: 0.8rem; color: var(--text-muted); }

        aside.toc { position: sticky; top: 56px; height: calc(100vh - 56px); padding: 2rem 1.5rem; font-size: 0.82rem; }
        .toc-title { font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; font-size: 0.72rem; letter-spacing: 0.05em; }
        .toc-link { display: block; color: var(--text-muted); text-decoration: none; margin-bottom: 0.6rem; transition: color 0.15s; }
        .toc-link:hover { color: var(--primary-light); }
    </style>
</head>
<body>
    <header>
        <div class="brand-group">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span style="font-weight: 800; font-size: 0.95rem;">Logistica Hub Suite v4.0</span>
            <span class="brand-badge">Documentacao Oficial</span>
        </div>
        <div style="display: flex; gap: 0.8rem;">
            <a href="/" class="btn">Aplicacao Super-App</a>
            <a href="/mcp" class="btn" style="border-color: rgba(16,185,129,0.4); color: #34d399;">Portal MCP</a>
            <a href="/docs" class="btn btn-primary">Swagger Studio (/docs)</a>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="search-trigger" onclick="abrirBusca()">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Pesquisar na suite...
                </div>
                <kbd>Ctrl K</kbd>
            </div>
            <ul class="sidebar-nav" id="sidebar-nav-list"></ul>
        </aside>

        <main class="content">
            <div class="breadcrumb" id="breadcrumb-box">Docs > Arquitetura</div>
            <h1 class="doc-title" id="page-title">Carregando...</h1>
            <p class="doc-subtitle" id="page-subtitle"></p>
            <div id="page-content-area"></div>
        </main>

        <aside class="toc">
            <div class="toc-title">Navegacao Rapida</div>
            <div id="toc-links-area"></div>
        </aside>
    </div>

    <div class="modal-search" id="search-modal" onclick="fecharBusca(event)">
        <div class="search-container" onclick="event.stopPropagation()">
            <div class="search-input-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="modal-search-input" placeholder="Pesquisar em toda a documentacao da suite..." oninput="filtrarResultadosBusca(this.value)">
                <kbd style="color: var(--text-muted); font-size: 0.75rem; background: rgba(255,255,255,0.06); padding: 0.2rem 0.5rem; border-radius: 4px;">ESC</kbd>
            </div>
            <div class="search-results-list" id="search-results-box"></div>
        </div>
    </div>

    <script>
        const docPages = [{"id": "intro", "cat": "1. Arquitetura da Suite", "title": "Logistica Hub v4.0 — Visao Geral", "subtitle": "Plataforma corporativa integrada para gestao de frotas, entregas rastreadas, WMS e faturamento de fretes.", "content": "\n            <div class=\"callout tip\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/></svg>\n                <div>\n                    <strong>Padrao Monolito Modular AIDD v4.0:</strong> Arquitetura de microsservicos verticais integrados em um unico nucleo de alta performance com EventBus assincrono, SQLite WAL concorrente e Servidor Nativo MCP (Model Context Protocol).\n                </div>\n            </div>\n\n            <h2>Principios de Engenharia</h2>\n            <p>O Logistica Hub v4.0 segue rigorosamente as diretrizes de desenvolvimento agêntico de classe mundial:</p>\n            <ul>\n                <li><strong>Security First:</strong> Headers HTTP OWASP nosniff, DENY frame, sanitizacao estrita de inputs SQL e isolamento de rotas.</li>\n                <li><strong>Zero Dependencias Pesadas:</strong> Nucleo operacional executado na biblioteca padrao do Python, garantindo tempo de resposta sub-10ms.</li>\n                <li><strong>Interface Sem Emojis:</strong> Design corporativo puro com iconografia vetorial SVG Lucide e tipografia Plus Jakarta Sans.</li>\n                <li><strong>Event-Driven Cross-Domain:</strong> Desacoplamento total entre modais operacionais e lancamentos contabeis.</li>\n            </ul>\n        "}, {"id": "mod_frotas", "cat": "2. Modulos Operacionais", "title": "Modulo de Gestao de Frotas", "subtitle": "Controle patrimonial de caminhoes, motoristas, telemetria e disponibilidade operacional.", "content": "\n            <h2>Estrutura de Frotas</h2>\n            <p>O modulo gerencia a alocacao de veiculos pesados com monitoramento de quilometragem e capacidade de tracao:</p>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Status</th><th>Definicao</th><th>Impacto Operacional</th></tr>\n                </thead>\n                <tbody>\n                    <tr><td><code>disponivel</code></td><td>Veiculo pronto para carregamento no patio</td><td>Pode ser vinculado a novas remessas</td></tr>\n                    <tr><td><code>em_rota</code></td><td>Caminhao em transito com carga vinculada</td><td>Bloqueado para novas alocacoes</td></tr>\n                    <tr><td><code>manutencao</code></td><td>Veiculo em oficina mecânica preventiva ou corretiva</td><td>Dispara incidente P1 automatico no suporte</td></tr>\n                </tbody>\n            </table>\n        "}, {"id": "mod_entregas", "cat": "2. Modulos Operacionais", "title": "Modulo de Entregas & Rastreamento", "subtitle": "Ciclo de vida de remessas com codigo de rastreamento UUID e disparos de faturamento.", "content": "\n            <h2>Regra de Faturamento Automatico (Cross-Domain)</h2>\n            <p>Quando o operador ou motorista altera o status da entrega para <code>entregue</code>:</p>\n            <ol>\n                <li>O EventBus emite <code>entrega_concluida</code> com o valor e destinatario.</li>\n                <li>O modulo financeiro captura o evento e insere automaticamente uma receita liquidada no fluxo de caixa.</li>\n                <li>Os webhooks externos cadastrados sao notificados em tempo real.</li>\n            </ol>\n        "}, {"id": "mod_wms", "cat": "2. Modulos Operacionais", "title": "Modulo WMS & Armazem", "subtitle": "Mapeamento de enderecamento de paletes, SKUs industriais e inventario continuo.", "content": "\n            <h2>Mapeamento de Ruas e Posicoes</h2>\n            <p>O enderecamento WMS utiliza o padrao <code>RUA-[LETRA]-[NUMERO]</code> para indexacao rapida de carga e descarga por empilhadeiras.</p>\n        "}, {"id": "mod_financeiro", "cat": "2. Modulos Operacionais", "title": "Modulo Financeiro de Fretes & DRE", "subtitle": "Gestao de receitas de frete, custos de combustivel, pedagios e saldo liquido da frota.", "content": "\n            <h2>Demonstrativo de Resultado do Frete (DRE)</h2>\n            <p>Calcula em tempo real a margem liquida da operacao:</p>\n            <p><code>Margem Liquida = Total de Fretes Recebidos - (Diesel + Pedagios + Manutencao)</code></p>\n        "}, {"id": "mod_suporte", "cat": "2. Modulos Operacionais", "title": "Central de Incidentes & SLA", "subtitle": "Monitoramento de panes mecanicas, sinistros e conformidade com niveis de servico.", "content": "\n            <h2>Matriz de Criticidade de SLA</h2>\n            <ul>\n                <li><strong>P1 (2 Horas):</strong> Pane mecanica em rodovia com carga perecivel ou de alto valor.</li>\n                <li><strong>P2 (4 Horas):</strong> Atraso logistico por bloqueio de pista.</li>\n                <li><strong>P3 (24 Horas):</strong> Solicitacao de troca de pneu ou revisao programada.</li>\n            </ul>\n        "}, {"id": "eventbus_specs", "cat": "3. Orquestracao & EventBus", "title": "Barramento Central de Eventos", "subtitle": "Especificacao tecnica dos eventos emitidos e consumidos na suite.", "content": "\n            <h2>Tabela de Eventos Cross-Domain</h2>\n            <table class=\"doc-table\">\n                <thead>\n                    <tr><th>Evento</th><th>Modulo Emissor</th><th>Modulo Receptor</th><th>Acao Executada</th></tr>\n                </thead>\n                <tbody>\n                    <tr><td><code>entrega_concluida</code></td><td>Entregas</td><td>Financeiro</td><td>Lanca receita de frete liquidada</td></tr>\n                    <tr><td><code>veiculo_manutencao</code></td><td>Frotas</td><td>Suporte SLA</td><td>Abre chamado de revisao tecnica P1</td></tr>\n                </tbody>\n            </table>\n        "}, {"id": "mcp_server_specs", "cat": "4. Inteligencia Artificial (MCP)", "title": "Servidor Nativo Universal MCP", "subtitle": "Especificacao do Model Context Protocol para Claude Desktop, Cursor e Antigravity.", "content": "\n            <h2>Protocolo JSON-RPC 2.0 Nativo</h2>\n            <p>Disponivel via linha de comando (STDIO) e via Web em <code>http://localhost:3000/mcp</code> com testador integrado.</p>\n        "}, {"id": "api_reference", "cat": "5. APIs & Desenvolvedores", "title": "Swagger Studio & OpenAPI 3.1", "subtitle": "Guia de consumo de endpoints REST da suite de logistica.", "content": "\n            <h2>Central Swagger Studio (/docs)</h2>\n            <p>Todos os endpoints estao documentados com tabelas de parametros, exemplos de payloads e testador interativo ao vivo.</p>\n        "}, {"id": "deploy_guide", "cat": "6. Operacoes & Infraestrutura", "title": "Guia de Instalacao & Deploy", "subtitle": "Execucao local, configuracao de porta e politicas de backup.", "content": "\n            <h2>Comando de Inicializacao</h2>\n            <pre class=\"code-box\">python src/server.py</pre>\n            <p>O servidor inicia automaticamente na porta <code>3000</code> com os schemas DDL carregados.</p>\n        "}];
        let currentPageIndex = 0;

        function montarSidebar() {
            const nav = document.getElementById('sidebar-nav-list');
            let html = '';
            let currentCat = '';

            docPages.forEach((page, idx) => {
                if (page.cat !== currentCat) {
                    currentCat = page.cat;
                    html += '<li class="nav-cat">' + currentCat + '</li>';
                }
                const activeClass = idx === 0 ? 'active' : '';
                html += '<li><a class="nav-item ' + activeClass + '" onclick="carregarPagina(' + idx + ')" id="nav-item-' + idx + '">' + page.title + '</a></li>';
            });
            nav.innerHTML = html;
        }

        function carregarPagina(index) {
            if (index < 0 || index >= docPages.length) return;
            currentPageIndex = index;
            const p = docPages[index];

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('breadcrumb-box').innerText = 'Docs > ' + p.cat + ' > ' + p.title;
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-subtitle').innerText = p.subtitle;
            document.getElementById('page-content-area').innerHTML = p.content;

            const h2Elements = document.getElementById('page-content-area').querySelectorAll('h2');
            const tocArea = document.getElementById('toc-links-area');
            let tocHtml = '';
            h2Elements.forEach((h2, i) => {
                const anchorId = 'section-' + i;
                h2.id = anchorId;
                tocHtml += '<a href="#' + anchorId + '" class="toc-link">' + h2.innerText + '</a>';
            });
            tocArea.innerHTML = tocHtml || '<span style="color: var(--text-muted);">Topico unico</span>';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirBusca() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('modal-search-input').focus();
            filtrarResultadosBusca('');
        }

        function fecharBusca() {
            document.getElementById('search-modal').style.display = 'none';
        }

        function filtrarResultadosBusca(query) {
            const q = query.toLowerCase();
            const box = document.getElementById('search-results-box');
            const results = docPages.filter(p => !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));

            box.innerHTML = results.map(p => {
                const idx = docPages.indexOf(p);
                return '<div class="search-item" onclick="carregarPagina(' + idx + '); fecharBusca();">' +
                       '<div class="search-item-title">' + p.title + '</div>' +
                       '<div class="search-item-sub">' + p.cat + ' • ' + p.subtitle + '</div>' +
                       '</div>';
            }).join('');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                abrirBusca();
            }
            if (e.key === 'Escape') fecharBusca();
        });

        window.onload = () => {
            montarSidebar();
            carregarPagina(0);
        };
    </script>
</body>
</html>
