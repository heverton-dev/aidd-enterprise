<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistica & Frota Inteligente — Enterprise Suite v4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #050b18;
            --surface-hover: #081226;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #10b981;
            --orange: #f59e0b;
            --red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        header { height: 60px; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
        .brand-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.6rem; color: #fff; }
        .badge-ver { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary-light); font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 9999px; }

        .btn { padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn:hover { background: rgba(255, 255, 255, 0.08); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }

        .app-switcher { display: flex; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 10px; padding: 0.25rem; gap: 0.25rem; }
        .tab-btn { padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 700; color: var(--muted); border: none; background: none; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 0.4rem; }
        .tab-btn.active { background: rgba(59, 130, 246, 0.2); color: var(--primary-light); }

        main { max-width: 1300px; width: 100%; margin: 0 auto; padding: 2.5rem 1.5rem; flex: 1; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
        .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.4rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .kpi-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; color: var(--muted); }
        .kpi-val { font-size: 1.8rem; font-weight: 800; color: #fff; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        .card-title { font-size: 1.15rem; font-weight: 800; color: #fff; }

        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 0.9rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; }

        .badge-st { font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
        .st-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .st-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .st-orange { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-body { background: #050b18; border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 2rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .modal-title { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
        .form-group input, .form-group select { background: #020617; border: 1px solid var(--border); color: #fff; padding: 0.65rem; border-radius: 8px; font-size: 0.88rem; outline: none; }
        .form-group input:focus { border-color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>Logistica & Frota Inteligente</span>
            <span class="badge-ver">Enterprise Suite v4.0</span>
        </div>

        <div class="app-switcher">
            <button class="tab-btn active" onclick="trocarModulo('frotas')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                Frotas
            </button>
            <button class="tab-btn" onclick="trocarModulo('entregas')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                Entregas & Rastreio
            </button>
            <button class="tab-btn" onclick="trocarModulo('wms')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                WMS Estoque
            </button>
            <button class="tab-btn" onclick="trocarModulo('financeiro')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Fretes Financeiro
            </button>
            <button class="tab-btn" onclick="trocarModulo('incidentes')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                Incidentes SLA
            </button>
        </div>

        <div style="display: flex; gap: 0.8rem;">
            <a href="/mcp" class="btn" style="border-color: rgba(16,185,129,0.4); color: #34d399;">Portal MCP</a>
            <a href="/docs/guia" class="btn">Guia Oficial</a>
            <a href="/docs" class="btn btn-primary">Swagger Studio</a>
        </div>
    </header>

    <main>
        <div class="kpi-grid">
            <div class="kpi-card">
                <span class="kpi-title">Veiculos na Frota</span>
                <span class="kpi-val" id="kpi-veiculos">3 Ativos</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Fretes em Transito</span>
                <span class="kpi-val" id="kpi-entregas">R$ 22.700</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Saldo Liquido</span>
                <span class="kpi-val" id="kpi-saldo" style="color: #34d399;">R$ 4.400</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Armazem WMS</span>
                <span class="kpi-val" id="kpi-wms">1.830 Itens</span>
            </div>
        </div>

        <div id="module-container"></div>
    </main>

    <!-- MODAL NOVO VEICULO -->
    <div class="modal" id="modal-veiculo">
        <div class="modal-body">
            <div class="modal-title">Cadastrar Novo Veiculo</div>
            <div class="form-group">
                <label>Placa</label>
                <input type="text" id="v-placa" placeholder="ex: BRA2E19">
            </div>
            <div class="form-group">
                <label>Modelo do Caminhao</label>
                <input type="text" id="v-modelo" placeholder="ex: Scania R450 6x2">
            </div>
            <div class="form-group">
                <label>Motorista Responsavel</label>
                <input type="text" id="v-motorista" placeholder="ex: Joao da Silva">
            </div>
            <div class="form-group">
                <label>Capacidade de Carga (KG)</label>
                <input type="number" id="v-cap" placeholder="32000">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem;">
                <button class="btn" onclick="fecharModal('modal-veiculo')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarVeiculo()">Cadastrar Veiculo</button>
            </div>
        </div>
    </div>

    <!-- MODAL NOVA REMESSA -->
    <div class="modal" id="modal-entrega">
        <div class="modal-body">
            <div class="modal-title">Criar Nova Remessa de Entrega</div>
            <div class="form-group">
                <label>Destinatario / Empresa</label>
                <input type="text" id="e-dest" placeholder="ex: BioMed Industria">
            </div>
            <div class="form-group">
                <label>Cidade e UF de Destino</label>
                <input type="text" id="e-cidade" placeholder="ex: Campinas/SP">
            </div>
            <div class="form-group">
                <label>Valor do Frete (R$)</label>
                <input type="number" id="e-valor" placeholder="8500">
            </div>
            <div class="form-group">
                <label>Peso Total (KG)</label>
                <input type="number" id="e-peso" placeholder="14000">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem;">
                <button class="btn" onclick="fecharModal('modal-entrega')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarEntrega()">Criar Remessa</button>
            </div>
        </div>
    </div>

    <script>
        let moduloAtual = 'frotas';

        function trocarModulo(mod) {
            moduloAtual = mod;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(mod)));
            renderizarModulo();
        }

        async function renderizarModulo() {
            const container = document.getElementById('module-container');

            if (moduloAtual === 'frotas') {
                const res = await fetch('/api/frotas/veiculos');
                const veics = await res.json();
                document.getElementById('kpi-veiculos').innerText = veics.length + ' Veiculos';

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Frota de Veiculos & Caminhoes</div>
                            <button class="btn btn-primary" onclick="abrirModal('modal-veiculo')">+ Novo Veiculo</button>
                        </div>
                        <table>
                            <thead>
                                <tr><th>PLACA</th><th>MODELO</th><th>MOTORISTA</th><th>CAPACIDADE</th><th>STATUS</th><th>ACOES</th></tr>
                            </thead>
                            <tbody>
                                ${veics.map(v => `
                                    <tr>
                                        <td><strong>${v.placa}</strong></td>
                                        <td>${v.modelo}</td>
                                        <td>${v.motorista}</td>
                                        <td>${v.capacidade_kg.toLocaleString()} kg</td>
                                        <td><span class="badge-st ${v.status === 'disponivel' ? 'st-green' : (v.status === 'em_rota' ? 'st-blue' : 'st-orange')}">${v.status.toUpperCase()}</span></td>
                                        <td>
                                            <button class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="alternarStatusVeiculo(${v.id})">Alternar Status</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (moduloAtual === 'entregas') {
                const res = await fetch('/api/entregas/listar');
                const entregas = await res.json();

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Remessas & Rastreamento em Tempo Real</div>
                            <button class="btn btn-primary" onclick="abrirModal('modal-entrega')">+ Nova Remessa</button>
                        </div>
                        <table>
                            <thead>
                                <tr><th>RASTREIO</th><th>DESTINATARIO</th><th>CIDADE</th><th>VALOR FRETE</th><th>STATUS</th><th>ACAO</th></tr>
                            </thead>
                            <tbody>
                                ${entregas.map(e => `
                                    <tr>
                                        <td><strong style="color: #60a5fa;">${e.codigo_rastreio}</strong></td>
                                        <td>${e.destinatario}</td>
                                        <td>${e.cidade_destino}</td>
                                        <td>R$ ${e.valor_frete.toLocaleString()}</td>
                                        <td><span class="badge-st ${e.status === 'entregue' ? 'st-green' : (e.status === 'em_transito' ? 'st-blue' : 'st-orange')}">${e.status.toUpperCase()}</span></td>
                                        <td>
                                            ${e.status !== 'entregue' ? `<button class="btn btn-primary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="avancarEntrega(${e.id})">Finalizar Entrega (➔ ERP)</button>` : '<span style="color: #34d399; font-weight: 700;">Faturado</span>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (moduloAtual === 'wms') {
                const res = await fetch('/api/wms/estoque');
                const itens = await res.json();

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Armazem WMS & Localizacao de Paletes</div>
                        </div>
                        <table>
                            <thead>
                                <tr><th>SKU</th><th>DESCRICAO</th><th>POSICAO</th><th>QUANTIDADE</th><th>VALOR UNIT.</th></tr>
                            </thead>
                            <tbody>
                                ${itens.map(i => `
                                    <tr>
                                        <td><strong>${i.sku}</strong></td>
                                        <td>${i.descricao}</td>
                                        <td><span class="badge-st st-blue">${i.posicao_palete}</span></td>
                                        <td>${i.quantidade.toLocaleString()} un</td>
                                        <td>R$ ${i.valor_unitario.toLocaleString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (moduloAtual === 'financeiro') {
                const res = await fetch('/api/financeiro/fretes');
                const fretes = await res.json();

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Controle Financeiro de Fretes & Despesas Operacionais</div>
                        </div>
                        <table>
                            <thead>
                                <tr><th>TIPO</th><th>DESCRICAO</th><th>VALOR</th><th>VENCIMENTO</th><th>STATUS</th></tr>
                            </thead>
                            <tbody>
                                ${fretes.map(f => `
                                    <tr>
                                        <td><span class="badge-st ${f.tipo === 'receita' ? 'st-green' : 'st-orange'}">${f.tipo.toUpperCase()}</span></td>
                                        <td>${f.descricao}</td>
                                        <td><strong>R$ ${f.valor.toLocaleString()}</strong></td>
                                        <td>${f.data_vencimento}</td>
                                        <td><span class="badge-st ${f.status === 'pago' ? 'st-green' : 'st-orange'}">${f.status.toUpperCase()}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (moduloAtual === 'incidentes') {
                const res = await fetch('/api/suporte/incidentes');
                const incs = await res.json();

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Incidentes Operacionais & SLA</div>
                        </div>
                        <table>
                            <thead>
                                <tr><th>PROTOCOLO</th><th>TITULO</th><th>VEICULO</th><th>PRIORIDADE</th><th>SLA</th><th>STATUS</th></tr>
                            </thead>
                            <tbody>
                                ${incs.map(i => `
                                    <tr>
                                        <td><strong>${i.protocolo}</strong></td>
                                        <td>${i.titulo}</td>
                                        <td>${i.veiculo_placa}</td>
                                        <td><span class="badge-st ${i.prioridade === 'P1' ? 'st-orange' : 'st-blue'}">${i.prioridade}</span></td>
                                        <td>${i.sla_horas}h</td>
                                        <td><span class="badge-st st-green">${i.status.toUpperCase()}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

        async function salvarVeiculo() {
            const placa = document.getElementById('v-placa').value;
            const modelo = document.getElementById('v-modelo').value;
            const motorista = document.getElementById('v-motorista').value;
            const capacidade_kg = document.getElementById('v-cap').value;

            await fetch('/api/frotas/veiculos/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ placa, modelo, motorista, capacidade_kg })
            });
            fecharModal('modal-veiculo');
            renderizarModulo();
        }

        async function salvarEntrega() {
            const destinatario = document.getElementById('e-dest').value;
            const cidade_destino = document.getElementById('e-cidade').value;
            const valor_frete = document.getElementById('e-valor').value;
            const peso_kg = document.getElementById('e-peso').value;

            await fetch('/api/entregas/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ destinatario, cidade_destino, valor_frete, peso_kg })
            });
            fecharModal('modal-entrega');
            renderizarModulo();
        }

        async function alternarStatusVeiculo(id) {
            await fetch('/api/frotas/veiculos/alternar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            renderizarModulo();
        }

        async function avancarEntrega(id) {
            await fetch('/api/entregas/finalizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            renderizarModulo();
        }

        window.onload = renderizarModulo;
    </script>
</body>
</html>
